appId: dev.wintermute.desktop
productName: Wintermute
directories:
  output: release
files:
  - dist/**/*
  - electron/**/*
  - package.json
asar: true
extraResources:
  - from: browser-extension
    to: browser-extension
win:
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  entitlements: packaging/entitlements.mac.plist
  entitlementsInherit: packaging/entitlements.mac.plist
  extendInfo:
    NSAppleEventsUsageDescription: 读取已同意分享的前台窗口标题。
    NSMicrophoneUsageDescription: 录制你主动开始并选择分享的语音。
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [x64, arm64]
