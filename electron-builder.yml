appId: dev.purin.desktop
productName: Purin
icon: public/app-icon.png
afterPack: packaging/fix-win-icon.cjs
directories:
  output: release
files:
  - dist/**/*
  - electron/**/*
  - '!electron/**/*.test.cjs'
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  entitlements: packaging/entitlements.mac.plist
  entitlementsInherit: packaging/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: 在对话中录入语音并转写为可编辑的文字。
    NSAppleEventsUsageDescription: 按你的设置读取前台窗口标题、查看访达选中项、创建备忘录或控制音乐播放。
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [x64, arm64]
