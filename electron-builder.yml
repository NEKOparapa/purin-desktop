appId: dev.wintermute.desktop
productName: Wintermute
directories:
  output: release
files:
  - dist/**/*
  - electron/**/*
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [x64, arm64]
