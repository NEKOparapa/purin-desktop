<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Wintermute · 浏览器分享</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header><strong>Wintermute</strong><span id="connection"></span></header>
    <main>
      <p id="page"></p>
      <button type="button" id="share">分享当前网页</button>
      <p class="hint">选中文字后，也可以通过右键菜单分享。</p>
      <label id="site-row"
        ><input id="site" type="checkbox" /> 自动记录此站点的前台页面</label
      >
      <details id="settings">
        <summary>桌面连接与站点</summary>
        <form id="pair">
          <label for="code">桌面设置中的浏览器配对码</label>
          <input id="code" type="password" autocomplete="off" required />
          <button type="submit">验证配对</button>
        </form>
        <ul id="sites"></ul>
      </details>
      <div id="queue" hidden>
        <span id="count"></span>
        <button type="button" id="retry">重试</button>
        <button type="button" id="discard">清空</button>
      </div>
      <p role="status" id="message"></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
